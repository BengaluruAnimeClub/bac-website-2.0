name: Daily Vercel Deploy & DB Keepalive

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch:

jobs:
  trigger-vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_iJMbNP4Hf1uuPv1rFMuCtW3Hs1xN/OJpkJ7Fdfn"

      - name: Ping Comments DB Keepalive
        run: |
          curl -s "https://bac.moe/api/comments?slug=keepalive" > /dev/null || true
